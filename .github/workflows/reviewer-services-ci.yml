name: Reviewer services CI

on:
  pull_request:
    branches:
      - codex/future-release-safety
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewer-services-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reviewer:
    name: Protocol and reviewer service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check shared review contracts
        run: npm run check -w @xiazi/contracts
      - name: Check release domain
        run: npm run check -w @xiazi/domain
      - name: Check reviewer service
        run: npm run check -w @xiazi/reviewer
      - name: Build reviewer service
        run: npm run build -w @xiazi/reviewer

  application-integration:
    name: Main application fail-closed integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check web integration
        run: npm run check -w @xiazi/web
      - name: Run fail-closed staging smoke test
        run: npm run test -w @xiazi/web -- tests/unit/release-service.test.ts
      - name: Build web application
        run: npm run build -w @xiazi/web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run test:e2e -w @xiazi/web
