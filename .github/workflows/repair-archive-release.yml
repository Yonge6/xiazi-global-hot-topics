name: Repair archived Release V2 issue

on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: Archive issue date to restore
        required: true
        type: string
      archive_release_id:
        description: Fully validated historical release to activate once
        required: true
        type: string
      restore_release_id:
        description: Current release restored immediately after the archive activation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-v2-production-rollout
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-v2-storage-staging
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
      ISSUE_DATE: ${{ inputs.issue_date }}
      ARCHIVE_RELEASE_ID: ${{ inputs.archive_release_id }}
      RESTORE_RELEASE_ID: ${{ inputs.restore_release_id }}
    steps:
      - name: Activate the archived release and restore current atomically
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = "cxjftltkdbsxxjgmxvsm"
          node -e 'const url = new URL(process.env.SUPABASE_URL); if (url.protocol !== "https:" || url.hostname !== "cxjftltkdbsxxjgmxvsm.supabase.co") process.exit(1)'
          [[ "$ISSUE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$ARCHIVE_RELEASE_ID" =~ ^rel_[0-9]{8}_[0-9a-f]{24}$ ]]
          [[ "$RESTORE_RELEASE_ID" =~ ^rel_[0-9]{8}_[0-9a-f]{24}$ ]]
          test "$ARCHIVE_RELEASE_ID" != "$RESTORE_RELEASE_ID"

          release_rows="$(curl --fail --silent --show-error \
            --get "${SUPABASE_URL}/rest/v1/publication_releases" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --data-urlencode "issue_date=eq.${ISSUE_DATE}" \
            --data-urlencode "release_id=eq.${ARCHIVE_RELEASE_ID}" \
            --data-urlencode "select=release_id,status,validation_report")"
          printf '%s' "$release_rows" | jq -e '
            length == 1
            and .[0].status == "ready_for_approval"
            and .[0].validation_report.passed == true
            and .[0].validation_report.sourceCount >= 8
            and .[0].validation_report.posterCount == 18
            and .[0].validation_report.storageVerification.policyVerified == true
            and .[0].validation_report.storageVerification.overwriteDenied == true
            and .[0].validation_report.storageVerification.deleteDenied == true
          ' >/dev/null

          activation_payload="$(jq -n \
            --arg release_id "$ARCHIVE_RELEASE_ID" \
            --arg activation_key "archive-repair:${ISSUE_DATE}:${ARCHIVE_RELEASE_ID}" \
            '{
              p_release_id: $release_id,
              p_approver: "release-automation:archive-repair",
              p_activation_key: $activation_key,
              p_activation_mode: "human",
              p_commit_sha: null,
              p_validation_hash: null
            }')"
          activation_response="$(curl --fail --silent --show-error \
            --request POST "${SUPABASE_URL}/rest/v1/rpc/activate_publication_release" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header 'Content-Type: application/json' \
            --data-binary "$activation_payload")"
          printf '%s' "$activation_response" | jq -e --arg release_id "$ARCHIVE_RELEASE_ID" \
            '.currentActiveReleaseId == $release_id' >/dev/null

          rollback_payload="$(jq -n \
            --arg release_id "$RESTORE_RELEASE_ID" \
            --arg activation_key "archive-repair-restore:${ISSUE_DATE}:${RESTORE_RELEASE_ID}" \
            --arg reason "Restore current issue immediately after historical archive activation" \
            '{
              p_release_id: $release_id,
              p_actor: "release-automation:archive-repair",
              p_activation_key: $activation_key,
              p_reason: $reason
            }')"
          rollback_response="$(curl --fail --silent --show-error \
            --request POST "${SUPABASE_URL}/rest/v1/rpc/rollback_publication_release" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header 'Content-Type: application/json' \
            --data-binary "$rollback_payload")"
          printf '%s' "$rollback_response" | jq -e --arg release_id "$RESTORE_RELEASE_ID" \
            '.currentActiveReleaseId == $release_id' >/dev/null

          archive_rows="$(curl --fail --silent --show-error \
            --get "${SUPABASE_URL}/rest/v1/publication_releases" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --data-urlencode "release_id=eq.${ARCHIVE_RELEASE_ID}" \
            --data-urlencode "select=release_id,status")"
          printf '%s' "$archive_rows" | jq -e \
            'length == 1 and .[0].status == "superseded"' >/dev/null
          jq -n \
            --arg issue_date "$ISSUE_DATE" \
            --arg archived_release "$ARCHIVE_RELEASE_ID" \
            --arg current_release "$RESTORE_RELEASE_ID" \
            '{issueDate:$issue_date,archivedReleaseId:$archived_release,currentReleaseId:$current_release,status:"restored"}' \
            >> "$GITHUB_STEP_SUMMARY"
